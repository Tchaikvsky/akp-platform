spec:
  hostnames:
    - argocd-bkp.kinexysplatform.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kinexys-gateway
      namespace: addons
      sectionName: kinexys-https-listener
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 443
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/stream
      timeouts:
        request: 3600s   # or omit `request` entirely if your Gateway API version allows unbounded
    - backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 443
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 60s